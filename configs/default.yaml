project:
  name: uamco_dag
  output_root: outputs
  seed: 1

data:
  streets_graph: data/real_datasets/streets/graphs/gurnee/gurnee-graph.json
  streets_traffic_zip: data/real_datasets/streets/trafficdata/gurnee-traffic-dictionary.json.zip
  uci_mat: data/real_datasets/uci/unzipped/traffic_dataset.mat
  terrain_srtm: data/real_datasets/terrain/srtm_elevation_grid_46.json
  processed_cache: data/processed/gurnee_train_v2.npz
  spatial_split: train
  traffic_start_hour: 5
  traffic_end_hour: 23
  traffic_sample_minutes: 10
  map_radius_m: 1800.0
  # Real Pegasus execution traces; training/evaluation are split by source file.
  workflow_root: data/pegasus
  workflow_families: [montage, cycles, seismology]
  workflow_split: train
  workflow_holdout_fraction: 0.25
  workflow_split_seed: 1729
  workflow_windows_per_trace: 4

system:
  # Relative error amplitude used only by the contact-horizon predictor.
  # The physical contact duration is always computed from the exact trajectory.
  contact_prediction_error: 0.0
  position_prediction_std_m: 0.0
  velocity_prediction_std_mps: 0.0
  completion_only_dependencies: false
  num_vehicles: 16
  num_rsus: 3
  num_uavs: 3
  demand_region_rows: 5
  demand_region_cols: 5
  num_subtasks: 12
  task_queue_size: 4
  dt_seconds: 1.0
  episode_steps: 128
  macro_steps: 5
  deadline_seconds: 28.0
  # No new jobs arrive during the final deadline-long drain window.  This
  # prevents structural right-censoring in completion and violation metrics.
  arrival_drain_seconds: 28.0
  aoi_threshold_seconds: 20.0
  base_arrival_rate: 0.055
  hotspot_arrival_rate: 0.16
  queue_drop_penalty_seconds: 56.0
  timeout_penalty_seconds: 56.0

task:
  # One global equivalent-compute/data mapping, shared by every trace/method.
  workflow_runtime_scale: 0.03
  workflow_reference_cpu_ghz: 2.0
  workflow_data_scale: 0.02
  # Observation feature scales, not sampling limits or workload truncation.
  max_cycles_g: 10.0
  max_input_mb: 10.0
  high_value_probability: 0.35
  urgent_probability: 0.35

compute:
  vehicle_cpu_ghz: 2.0
  rsu_cpu_ghz: 30.0
  uav_cpu_ghz: 18.0
  # Energy-efficient in-vehicle accelerator: slower than edge CPUs but lower
  # active joules/cycle, creating a physical local-vs-edge Pareto tradeoff.
  vehicle_energy_per_gcycle_j: 0.6
  rsu_energy_per_gcycle_j: 0.9
  uav_energy_per_gcycle_j: 1.3

radio:
  carrier_ghz: 2.4
  bandwidth_mhz: 120.0
  tx_power_w: 1.5
  noise_psd_dbm_hz: -174.0
  noise_figure_db: 7.0
  rsu_range_m: 500.0
  uav_range_m: 480.0
  rsu_height_m: 12.0
  vehicle_height_m: 1.8
  uav_height_m: 220.0
  nlos_extra_loss_db: 22.0
  backhaul_gbps: 1.0
  return_mbps: 200.0
  rayleigh_loss_db: 3.0
  los_a: 4.88
  los_b: 0.43
  los_extra_loss_db: 0.1
  a2g_nlos_extra_loss_db: 21.0
  beamwidth_deg: 130.8

uav:
  max_speed_mps: 20.0
  arrival_radius_m: 20.0
  profile_power_w: 79.86
  induced_power_w: 88.63
  tip_speed_mps: 120.0
  mean_rotor_velocity_mps: 4.03
  fuselage_drag_ratio: 0.6
  air_density_kg_m3: 1.225
  rotor_solidity: 0.05
  rotor_area_m2: 0.503
  base_power_w: 0.0
  battery_capacity_j: 900000.0
  battery_usage_ratio: 0.7
  migration_energy_j: 0.25

reward:
  delay_min: 0.0
  delay_max: 16.0
  energy_min_j: 0.0
  energy_max_j: 1000.0
  priority_weights: [4.0, 2.5, 1.5, 1.0]
  delay_reference: 16.0
  energy_reference_j: 1000.0
  anchors:
    - [0.9900, 0.0100]
    - [0.9000, 0.1000]
    - [0.5000, 0.5000]
    - [0.1000, 0.9000]
    - [0.0100, 0.9900]

model:
  hidden_dim: 128
  dag_layers: 2
  dropout: 0.0
  compile: true

train:
  episodes: 50
  num_envs: auto
  rollout_steps: 128
  load_multiplier_choices: [0.75, 1.0, 1.5, 2.0]
  update_epochs: 4
  minibatch_size: 4096
  learning_rate: 3.0e-4
  gamma: 1.0
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  entropy_final_coef: 0.002
  uav_entropy_coef: 0.02
  uav_entropy_final_coef: 0.004
  value_coef: 0.5
  max_grad_norm: 0.5
  amp: true
  checkpoint_every: 10

official_baselines:
  preference: [0.5, 0.5]
  hidden_dim: 128
  recurrent: true
  recurrent_layers: 1
  data_chunk_length: 8
  actor_lr: 5.0e-4
  critic_lr: 5.0e-4
  update_epochs: 5
  num_mini_batch: 4
  entropy_coef: 0.01
  value_coef: 1.0
  value_norm: true

cavdn:
  rnn_hidden_dim: 64
  qmix_hidden_dim: 32
  hyper_hidden_dim: 64
  two_hyper_layers: true
  learning_rate: 1.0e-3
  gamma: 1.0
  grad_norm_clip: 10.0
  replay_episodes: 64
  batch_episodes: 32
  target_update_interval: 20
  target_tau: 0.001
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_fraction: 0.8

droo:
  hidden_dim_1: 120
  hidden_dim_2: 80
  learning_rate: 0.01
  training_interval: 10
  batch_size: 128
  memory_size: 100000
  initial_k: 16
  adaptive_interval: 32

evaluation:
  episodes: 50
  hypervolume_reference: [16.0, 1000.0]
  # Fixed before training; covers the declared 28 s deadline and stress energy.
  # Fair held-out evaluation keeps the stricter reference above.
  training_hypervolume_reference: [28.0, 1200.0]
  stress_load_multipliers: [0.5, 1.0, 1.5, 2.0]
  deterministic: false
  report_greedy: true

baselines:
  methods:
    - local_only
    - nearest_rsu
    - greedy_delay
    - greedy_energy
    - random_feasible
    - weighted_greedy
    - official_mappo
    - official_happo
    - official_cavdn
    - official_droo
